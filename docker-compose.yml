  #   command: sh -c "npm install && npm run dev -- --host 0.0.0.0"



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=http://localhost:5656/api
      - API_URL=http://localhost:5656
    depends_on:
      - backend


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5656:5656"
    environment:
      - PORT=5656
      - FIRESTORE_PROJECT_ID=triambh-web
      - GOOGLE_CLOUD_PROJECT=triambh-web
      - CLOUDSDK_CONFIG=/root/.config/gcloud
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    volumes:
      - "${APPDATA}/gcloud:/root/.config/gcloud:ro"

